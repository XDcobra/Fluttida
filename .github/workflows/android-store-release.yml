# 1. Calculates version and build number from tag like v1.2.3 or v1.2.3+45
# 2. Sets up Flutter environment
# 3. Decodes Android keystore from GitHub Secrets
# 4. Builds signed Android App Bundle (.aab) and APK (.apk)
# 5. Uploads signed artifacts as workflow artifacts
# 6. Creates GitHub Release and uploads signed artifacts to the release

name: Android Play Store release

on:
  # Manual trigger via Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.3)'
        required: true
        type: string
      build_number:
        description: 'Build number (optional, defaults to git commit count)'
        required: false
        type: string
  # Auto trigger on tags like v1.2.3 or v1.2.3+45
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-android-signed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example_app/fluttida
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensure commit count is accurate for build_number fallback

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_BANNER_UNIT_ANDROID: ${{ secrets.ADMOB_BANNER_UNIT_ANDROID }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ADMOB_APP_ID_ANDROID ADMOB_BANNER_UNIT_ANDROID; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting." >&2
            exit 1
          fi

      - name: Derive version from tag or input
        id: version
        run: |
          set -euo pipefail

          # Check if triggered by workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
            
            if [ -z "$BUILD_NUMBER" ]; then
              BUILD_NUMBER=$(git rev-list --count HEAD)
            fi
            
            echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Resolved version_name=$VERSION_NAME build_number=$BUILD_NUMBER (from workflow_dispatch)"
            exit 0
          fi

          # Otherwise, derive from tag
          REF="${GITHUB_REF:-}"
          TAG="${REF#refs/tags/}"

          if [ -z "$TAG" ] || [ "$TAG" = "$REF" ]; then
            echo "This workflow expects to run on a tag (vX.Y.Z or vX.Y.Z+NN)."
            exit 1
          fi

          # strip leading v
          VERSION_WITH_BUILD="${TAG#v}"

          # match X.Y.Z or X.Y.Z+NN (allows more dot segments)
          if [[ "$VERSION_WITH_BUILD" =~ ^([0-9]+(\.[0-9]+)*)(\+([0-9]+))?$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            BUILD_NUMBER="${BASH_REMATCH[4]}"
          else
            echo "Tag format invalid: $TAG. Expected vX.Y.Z or vX.Y.Z+NN"
            exit 1
          fi

          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(git rev-list --count HEAD)
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved version_name=$VERSION_NAME build_number=$BUILD_NUMBER"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/release.keystore
          EOF

      

      - name: Build Android App Bundle (signed)
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_UNIT_ANDROID: ${{ secrets.ADMOB_BANNER_UNIT_ANDROID }}
          ORG_GRADLE_PROJECT_ADS_ENABLED: 'true'
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Build Android APK (signed)
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_UNIT_ANDROID: ${{ secrets.ADMOB_BANNER_UNIT_ANDROID }}
          ORG_GRADLE_PROJECT_ADS_ENABLED: 'true'
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluttida-android-signed-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}
          path: |
            example_app/fluttida/build/app/outputs/bundle/release/*.aab
            example_app/fluttida/build/app/outputs/flutter-apk/*.apk

  publish-to-play:
    runs-on: ubuntu-latest
    needs: build-android-signed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: fluttida-android-signed-${{ needs.build-android-signed.outputs.version_name }}+${{ needs.build-android-signed.outputs.build_number }}
          path: ./artifacts

      - name: Decode Android keystore
        if: always()
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        if: always()
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/release.keystore
          EOF

      - name: Prepare Fastlane JSON key
        env:
          FASTLANE_JSON_KEY: ${{ secrets.FASTLANE_JSON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FASTLANE_JSON_KEY:-}" ]; then
            echo "Missing secret: FASTLANE_JSON_KEY" >&2
            exit 1
          fi

          mkdir -p example_app/fluttida/android/fastlane
          # Write the JSON key to /tmp for the top-level Fastlane lane (CI uses repo-root fastlane)
          printf '%s' "$FASTLANE_JSON_KEY" > /tmp/google-play.json
          chmod 600 /tmp/google-play.json

      - name: Upload to Play Store (Closed Testing)
        env:
          VERSION_CODE: ${{ needs.build-android-signed.outputs.build_number }}
          VERSION_NAME: ${{ needs.build-android-signed.outputs.version_name }}
        run: |
          set -euo pipefail
          # Use the top-level Fastlane lane which expects artifacts in ./artifacts and /tmp/google-play.json
          if [ -f ./Gemfile ]; then
            bundle install
            bundle exec fastlane deploy_closed
          else
            fastlane deploy_closed
          fi

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/key.properties

      - name: Upload signed artifacts (for audit)
        uses: actions/upload-artifact@v4
        with:
          name: fluttida-android-signed-${{ needs.build-android-signed.outputs.version_name }}+${{ needs.build-android-signed.outputs.build_number }}
          path: |
            example_app/fluttida/build/app/outputs/bundle/release/*.aab
            example_app/fluttida/build/app/outputs/flutter-apk/*.apk
